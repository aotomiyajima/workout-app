
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Workout SNS</title>
</head>
<body>
    <h1>Workout SNS</h1>
    <p>今日のトレーニングを投稿しよう</p>

    <h2>トレーニング投稿</h2>

    <form method = "POST">
        <div>
            <label for = "workout_name">種目名</label>
            <input
            type = "text"
            id = "workout_name"
            name = "workout_name"
            required
            >
        </div>

        <div>
            <label for = "weight">重量(kg)</label>
            <input
            type = "number"
            id = "weight"
            name = "weight"
            min = "0"
            step = "0.5"
            required
            >
        </div>

        <button type = "submit">投稿 </button>
    </form>


<h2>投稿一覧</h2>

{% if workouts %}
    {% for workout in workouts %}
        <article>
            <h3>{{ workout["workout_name"] }}</h3>
            <p>重量：{{ workout["weight"] }} kg</p>
            <p>投稿日時：{{ workout["created_at"] }}</p>

            <a href="{{url_for('edit_workout',workout_id=workout['id'])}}">
                編集
            </a>

            <form
                action="{{url_for('delete_workout',workout_id=workout['id'])}}"
                method="POST"
            >
                <button type="submit">削除</button>
            </form>
        </article>
        <hr>
    {% endfor %}
{% else %}
    <p>まだ投稿がありません。</p>
{% endif %}
</body>
</html>
