<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>投稿の編集</title>
    </head>
    <body>
        <h1>投稿の編集</h1>

        <form method="POST">
            <div>
                <label for="workout_name">種目名</label>
                <input
                    type="text"
                    id="workout_name"
                    name="workout_name"
                    value="{{workout["workout_name"]}}"
                    required
                >
            </div>

            <div>
                <label for="weight">重量(kg)</label>
                <input
                    type="number"
                    id="weight"
                    name="weight"
                    step="0.5"
                    min="0"
                    value="{{workout['weight']}}"
                    required
                >
            </div>

            <button type="submit">変更を保存</button>
        </form>

        <a href="{{url_for('home')}}">投稿一覧に戻る</a>
    </body>
</html>
